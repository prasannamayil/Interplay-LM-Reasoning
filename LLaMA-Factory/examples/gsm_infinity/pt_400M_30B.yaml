### ============================================================================
### GSM-Infinity Pre-training Config — 400M Transformer (NTP) — 30B tokens
### Op range: 2-10 | Tokens: 30B (uniform, 3.3B/op) | Templates: All
### Architecture: 1024 hidden × 26 layers × 4096 FFN ≈ 398M params
### Hardware: 8x H100 GPUs
### Effective batch: 64 * 1 * 8 GPUs * 2048 tokens ≈ 1M tokens/step
### Steps: ~30,000
### ============================================================================

### Model Configuration
model_name_or_path: ../model_configs/qwen2_400M
trust_remote_code: true
train_from_scratch: true
flash_attn: fa2

### Training Method
stage: pt
do_train: true
finetuning_type: full

### Dataset Configuration
dataset: composition_hf
dataset_dir: /fast/pmayilvahanan/Interplay-LM-Reasoning/data
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
val_size: 0.0001

### Output Configuration
output_dir: saves/gsm_infinity/pt_400M_30B
logging_steps: 10
save_steps: 0.1
save_total_limit: 15
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### Training Hyperparameters
per_device_train_batch_size: 64
gradient_accumulation_steps: 1

learning_rate: 1.0e-4
weight_decay: 0.1
num_train_epochs: 1.0

lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr: 3e-5
warmup_ratio: 0.05
max_grad_norm: 1.0

bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### Evaluation Configuration
eval_strategy: "no"

### Task-specific Configuration (for data loading)
preset_path: /fast/pmayilvahanan/Interplay-LM-Reasoning/data/PRESET.json
task_name: composition-30B/op_level
task_setting: id2-10_uniform
task_token_count: 30B
id_max_op: 10
