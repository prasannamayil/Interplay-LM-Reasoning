### ============================================================================
### GSM-Infinity Pre-training Config (Paper §3 Recipe) v4
### Op range: 2-10 | Tokens: 10B | Templates: All (zoo, teacher, movie)
### Data mix: 20% op=2-4, 30% op=5-7, 50% op=8-10 (matching Table 2 §3)
### Hardware: 8x H100 GPUs
### ============================================================================

### Model Configuration
model_name_or_path: /fast/pmayilvahanan/Interplay-LM-Reasoning/model_configs/qwen2_100M
trust_remote_code: true
train_from_scratch: true
flash_attn: fa2

### Training Method
stage: pt
do_train: true
finetuning_type: full

### Dataset Configuration
dataset: composition_hf
dataset_dir: /fast/pmayilvahanan/Interplay-LM-Reasoning/data
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
val_size: 0.0001

### Output Configuration
output_dir: saves/gsm_infinity/pt_op2-10_10B_alltemps_skewed_v4
logging_steps: 10
save_steps: 0.1
save_total_limit: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### Training Hyperparameters (Paper settings)
# Token batch size = 32 * 1 * 8 GPUs * 2048 tokens = ~512K tokens/step
# For 10B tokens: ~20,000 steps
per_device_train_batch_size: 32
gradient_accumulation_steps: 1

learning_rate: 2.0e-4
weight_decay: 0.1
num_train_epochs: 1.0

# Cosine schedule with min_lr from paper
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs: 
  min_lr: 3e-5
warmup_ratio: 0.05
max_grad_norm: 1.0

# Mixed precision and optimization
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### Evaluation Configuration
eval_strategy: "no"

### Task-specific Configuration (for data loading)
# Uses the skewed distribution from the paper's Table 2 §3:
#   20% easy (op=2-4), 30% medium (op=5-7), 50% hard (op=8-10)
preset_path: /fast/pmayilvahanan/Interplay-LM-Reasoning/data/PRESET.json
task_name: composition-10B/op_level
task_setting: id2-10_0.2easy_0.3medium_0.5hard
task_token_count: 10B
id_max_op: 10