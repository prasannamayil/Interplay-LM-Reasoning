# FineWeb-Edu pre-training — apps.widen architecture zoo, ~400M reference scale.
# Realistic LM-style full-sequence training (D3): the "widen the line" contrast set
# on real prose. arch_type overridden per run via run_pretrain.sh. Mirrors
# apps/main/configs_fineweb/llama_400M_fineweb.yaml so dense == the Llama point.
# Requires FineWeb data prepared at /fast/pmayilvahanan/lm_datasets/ first.

dump_dir: null
name: "widen_400M_fineweb"
steps: 10_000
seed: 42
grad_acc_steps: 8

optim:
  lr: 3.0e-4
  weight_decay: 0.1
  warmup: 500
  lr_min_ratio: 0.1
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: false   # MoE routing is not compile-safe; dense/gqa/sliding may set true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 1024
  n_layers: 26
  n_heads: 16
  n_kv_heads: 4
  weight_tying: false
  attn_impl: sdpa
  arch_type: dense
  moe_num_experts: 8
  moe_top_k: 2
  moe_aux_coef: 0.01
  looped_n_unique_layers: 6
  looped_n_loops: 4
  sliding_window: null
  pattention_num_tokens: 1024

data:
  root_dir: /fast/pmayilvahanan/lm_datasets/
  sources:
    fineweb_edu_10bt_shuffled: 1.0
  batch_size: 8
  prefetch_size: 1024
  seq_len: 2048
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: hf
    path: /fast/pmayilvahanan/Interplay-LM-Reasoning/model_configs/qwen2_fineweb_400M

profiling:
  run: false

checkpoint:
  dump:
    every: 500
    keep: 25
  eval:
    every: 500
    keep: -1

logging:
  freq: 10

eval:
  harness:
    compute_loss: true
    tasks:
      - hellaswag
      - piqa
      - winogrande
      - arc_easy
      - arc_challenge
      - commonsense_qa
      - openbookqa
      - task: copa
        dataset_kwargs:
          trust_remote_code: true
      - mmlu
      - task: social_iqa
        dataset_kwargs:
          trust_remote_code: true
  validation:
    use_val_from_train_src: false
    max_steps: 5000
    root_dir: /fast/pmayilvahanan/lm_datasets/
    sources:
      - c4_shuffled
      - pile_uc_shuffled
      - fineweb_edu_10bt_shuffled
      - refineweb_shuffled
      - slimpajama_shuffled
  generator:
    max_tokens: 16384
    dtype: bf16
