# Experiment B: proposal-scale "widen the line" on FineWeb-Edu (realistic prose).
# 400M, ~8B tokens, 8-GPU full node, LM-style full-sequence (D3). arch_type via CLI.
# In-training cloze-harness eval every 2000 steps => per-checkpoint accuracy trajectory
# (the spread) for the OOD-vs-ID line. dense == the Llama reference point.
# Effective batch: 8/GPU x 8 accum x 8 GPUs x 2048 = ~1.05M tokens/step; 8000 steps ~= 8.4B tok.

name: "widen_400M_fineweb_b"
steps: 8000
seed: 42
grad_acc_steps: 8

optim:
  lr: 3.0e-4
  weight_decay: 0.1
  warmup: 400
  lr_min_ratio: 0.1
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: false   # MoE routing is not compile-safe; keep uniform across archs
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: true
  tp_size: 1

model:
  dim: 1024
  n_layers: 26
  n_heads: 16
  n_kv_heads: 4
  weight_tying: false
  attn_impl: sdpa
  arch_type: dense
  moe_num_experts: 8
  moe_top_k: 2
  moe_aux_coef: 0.01
  looped_n_unique_layers: 9
  looped_n_loops: 3
  sliding_window: null
  pattention_num_tokens: 1024

data:
  root_dir: /fast/pmayilvahanan/lm_datasets/
  sources:
    fineweb_edu_10bt_shuffled: 1.0
  batch_size: 8
  prefetch_size: 1024
  seq_len: 2048
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: hf
    path: /fast/pmayilvahanan/Interplay-LM-Reasoning/model_configs/qwen2_fineweb_400M

profiling:
  run: false

checkpoint:
  dump:
    every: 2000
    keep: 20
  eval:
    every: 2000
    keep: 20

logging:
  freq: 20

eval:
  harness:
    compute_loss: true
    tasks:
      - hellaswag
      - piqa
      - winogrande
      - arc_easy
      - arc_challenge
      - openbookqa
      - lambada_openai
  validation:
    use_val_from_train_src: false
    max_steps: 1000
    root_dir: /fast/pmayilvahanan/lm_datasets/
    sources: []          # only the train source (fineweb) *.val.jsonl is used
  generator:
    max_tokens: 16384
    dtype: bf16
